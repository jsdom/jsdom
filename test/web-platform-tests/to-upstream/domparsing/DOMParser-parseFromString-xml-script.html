<!DOCTYPE html>
<meta charset="utf-8">
<title>Parsing XML script elements and whitespace after an XML declaration</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- Regression test for https://github.com/jsdom/jsdom/issues/1775 -->
<script>
"use strict";

test(() => {
  // The slash escape prevents the HTML parser from ending this script.
  // eslint-disable-next-line no-useless-escape
  const doc = new DOMParser().parseFromString("<script>x<\/script>", "text/xml");
  assert_equals(doc.getElementsByTagName("parsererror").length, 0);
  assert_equals(doc.documentElement.localName, "script");
  assert_equals(doc.documentElement.namespaceURI, null);
  assert_equals(doc.documentElement.textContent, "x");
}, "A script element without an HTML namespace is valid XML");

test(() => {
  const doc = new DOMParser().parseFromString('<?xml version="1.0"?>\n<a></a>', "text/xml");
  assert_equals(doc.getElementsByTagName("parsererror").length, 0);
  assert_equals(doc.firstChild.nodeType, Node.ELEMENT_NODE);
  assert_equals(doc.firstChild.localName, "a");
  assert_equals(doc.childNodes.length, 1);
}, "Whitespace after the XML declaration does not become a document child");
</script>
