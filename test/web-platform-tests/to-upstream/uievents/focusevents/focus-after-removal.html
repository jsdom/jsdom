<!DOCTYPE html>
<meta charset="utf-8">
<title>Focus events after the focused element is removed from the DOM</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/infrastructure.html#node-remove-focus-fixup">
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#focus-update-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div id="log"></div>

<script>
"use strict";

// Removing the focused element sets the focused area of the document to the viewport. The removing
// steps explicitly do not run the unfocusing steps, so no blur or focus events are fired for the
// removal itself. Focusing something afterwards must then treat the viewport as the old chain:
// focus update steps step 1 pops the shared trailing Document, leaving an entry that is neither an
// element nor a Document, so no blur event is fired (step 2.2) and the related focus target is null
// (step 4.4).

function createInputs(t) {
  const first = document.createElement("input");
  const second = document.createElement("input");
  document.body.append(first, second);
  t.add_cleanup(() => {
    first.remove();
    second.remove();
  });
  return { first, second };
}

test(t => {
  const { first } = createInputs(t);

  first.focus();
  assert_equals(document.activeElement, first, "precondition: the element is focused");

  first.remove();

  assert_equals(document.activeElement, document.body, "activeElement falls back to the body");
  assert_true(document.hasFocus(), "the document still has focus");
}, "Removing the focused element moves the focused area to the viewport");

test(t => {
  const { first, second } = createInputs(t);
  first.focus();
  first.remove();

  const events = [];
  const record = t.step_func(e => events.push(`${e.type} at ${e.target === window ? "window" : e.target.localName}`));
  // Listen on the window so the capture path covers events targeted at the window itself as well.
  for (const type of ["blur", "focus", "focusin", "focusout"]) {
    window.addEventListener(type, record, { capture: true });
    t.add_cleanup(() => window.removeEventListener(type, record, { capture: true }));
  }

  second.focus();

  assert_array_equals(events, ["focus at input", "focusin at input"], "only focus and focusin are fired");
}, "Focusing after the focused element was removed fires no blur or focusout");

test(t => {
  const { first, second } = createInputs(t);
  first.focus();
  first.remove();

  const relatedTargets = [];
  const record = t.step_func(e => relatedTargets.push(e.relatedTarget));
  for (const type of ["focus", "focusin"]) {
    document.addEventListener(type, record, { capture: true });
    t.add_cleanup(() => document.removeEventListener(type, record, { capture: true }));
  }

  second.focus();

  assert_equals(relatedTargets.length, 2, "focus and focusin are fired");
  assert_equals(relatedTargets[0], null, "focus relatedTarget is null, not the Document");
  assert_equals(relatedTargets[1], null, "focusin relatedTarget is null, not the Document");
}, "relatedTarget is null when the previously focused element was removed");

test(t => {
  const { first, second } = createInputs(t);
  first.focus();
  first.remove();

  let windowBlurs = 0;
  const record = t.step_func(() => windowBlurs++);
  window.addEventListener("blur", record);
  t.add_cleanup(() => window.removeEventListener("blur", record));

  second.focus();

  assert_equals(windowBlurs, 0, "the window does not lose focus");
}, "No blur is fired at the window when the previously focused element was removed");

test(t => {
  const { first, second } = createInputs(t);
  first.focus();

  const events = [];
  const record = t.step_func(e => events.push([e.type, e.target, e.relatedTarget]));
  for (const type of ["blur", "focus"]) {
    document.addEventListener(type, record, { capture: true });
    t.add_cleanup(() => document.removeEventListener(type, record, { capture: true }));
  }

  second.focus();

  assert_array_equals(events.map(([type]) => type), ["blur", "focus"], "blur then focus");
  assert_array_equals(events.map(([, target]) => target), [first, second], "targets");
  assert_array_equals(
    events.map(([, , relatedTarget]) => relatedTarget),
    [second, first],
    "each event points at the other element"
  );
}, "A normal focus move still reports the other element as relatedTarget");
</script>
