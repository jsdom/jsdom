<!DOCTYPE html>
<meta charset="utf-8">
<title>Focusing steps: focusable area logic (hidden, inert, display: none)</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#focusable-area">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<input id="default-input">
<input id="inert-input" inert>
<input id="hidden-input" hidden>
<input id="display-none-input" style="display: none;">
<div id="inert-container" inert>
  <input id="nested-inert-input">
</div>
<div id="shadow-host" inert></div>

<script>
"use strict";

setup(() => {
  document.getElementById("default-input").focus();
  document.getElementById("default-input").blur();
});

test(() => {
  const input = document.getElementById("inert-input");
  input.focus();
  assert_not_equals(document.activeElement, input, "Element with inert attribute should not receive focus");
}, "Calling focus() on an inert element does nothing");

test(() => {
  const input = document.getElementById("hidden-input");
  input.focus();
  assert_not_equals(document.activeElement, input, "Element with hidden attribute should not receive focus");
}, "Calling focus() on a hidden element does nothing");

test(() => {
  const input = document.getElementById("display-none-input");
  input.focus();
  assert_not_equals(document.activeElement, input, "Element with display: none should not receive focus");
}, "Calling focus() on an element with display: none does nothing");

test(() => {
  const input = document.getElementById("nested-inert-input");
  input.focus();
  assert_not_equals(document.activeElement, input, "Element inside an inert container should not receive focus");
}, "Calling focus() on an element with an inert ancestor does nothing");

test(() => {
  const host = document.getElementById("shadow-host");
  const shadow = host.attachShadow({ mode: "open" });
  const shadowInput = document.createElement("input");
  shadow.appendChild(shadowInput);
  shadowInput.focus();
  assert_not_equals(document.activeElement, host, "Shadow host with inert should not become activeElement");
  assert_not_equals(shadow.activeElement, shadowInput, "Element inside an inert shadow host should not receive focus");
}, "Calling focus() on an element inside an inert shadow host does nothing");
</script>
