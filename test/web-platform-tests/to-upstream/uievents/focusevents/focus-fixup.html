<!DOCTYPE html>
<meta charset="utf-8">
<title>HTML Test: focus-fixup-rule</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#focus-fixup-rule">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div id="log"></div>

<script>
"use strict";

const testCases = [
  // --- Synchronous cases ---
  {
    name: "When the element is removed from the DOM",
    tag: "button",
    setup: el => {
      el.textContent = "Remove";
    },
    trigger: el => {
      el.remove();
    },
    isAsync: false
  },
  {
    name: "When an iframe is removed from the DOM",
    tag: "iframe",
    setup: el => {
      el.title = "iframe test 1";
    },
    trigger: el => {
      el.remove();
    },
    isAsync: false
  },

  // --- Asynchronous cases ---
  {
    name: "When the disabled attribute is added",
    tag: "button",
    setup: el => {
      el.textContent = "Disable";
    },
    trigger: el => {
      el.disabled = true;
    },
    isAsync: true
  },
  {
    name: "When the tabindex attribute is removed",
    tag: "div",
    setup: el => {
      el.tabIndex = 0;
      el.textContent = "Tabindex";
    },
    trigger: el => {
      el.removeAttribute("tabindex");
    },
    isAsync: true
  },
  {
    name: "When the contenteditable attribute is removed",
    tag: "div",
    setup: el => {
      el.setAttribute("contenteditable", "true");
      el.textContent = "Editable";
    },
    trigger: el => {
      el.removeAttribute("contenteditable");
    },
    isAsync: true
  },
  {
    name: "When the inert attribute is added to the element itself",
    tag: "button",
    setup: el => {
      el.textContent = "Inert";
    },
    trigger: el => {
      el.inert = true;
    },
    isAsync: true
  },
  {
    name: "When the inert attribute is added to an ancestor element",
    tag: "button",
    setup: el => {
      el.textContent = "Ancestor Inert";
    },
    trigger: (el, container) => {
      container.inert = true;
    },
    isAsync: true
  },
  {
    name: "When display: none is applied via CSS",
    tag: "button",
    setup: el => {
      el.textContent = "Display None";
    },
    trigger: el => {
      el.style.display = "none";
    },
    isAsync: true
  },
  {
    name: "When visibility: hidden is applied via CSS",
    tag: "button",
    setup: el => {
      el.textContent = "Visibility Hidden";
    },
    trigger: el => {
      el.style.visibility = "hidden";
    },
    isAsync: true
  },
  {
    name: "When the type of an input element is changed to hidden",
    tag: "input",
    setup: el => {
      el.type = "text";
    },
    trigger: el => {
      el.type = "hidden";
    },
    isAsync: true
  },
  {
    name: "When the hidden attribute is added",
    tag: "button",
    setup: el => {
      el.textContent = "Hidden Attribute";
    },
    trigger: el => {
      el.hidden = true;
    },
    isAsync: true
  },
  {
    name: "When the hidden attribute is added to an ancestor element",
    tag: "button",
    setup: el => {
      el.textContent = "Ancestor Hidden Attribute";
    },
    trigger: (el, container) => {
      container.hidden = true;
    },
    isAsync: true
  },
  {
    name: "When display: none is applied to an ancestor element via CSS",
    tag: "button",
    setup: el => {
      el.textContent = "Ancestor Display None";
    },
    trigger: (el, container) => {
      container.style.display = "none";
    },
    isAsync: true
  },
  {
    name: "When the inert attribute is added to an iframe",
    tag: "iframe",
    setup: el => {
      el.title = "iframe test 2";
    },
    trigger: el => {
      el.inert = true;
    },
    isAsync: true
  },
  {
    name: "When the hidden attribute is added to an iframe",
    tag: "iframe",
    setup: el => {
      el.title = "iframe test 3";
    },
    trigger: el => {
      el.hidden = true;
    },
    isAsync: true
  },
  {
    name: "When display: none is applied to an iframe via CSS",
    tag: "iframe",
    setup: el => {
      el.title = "iframe test 4";
    },
    trigger: el => {
      el.style.display = "none";
    },
    isAsync: true
  }
];

async function prepareTestEnvironment(t, testCase) {
  const container = document.createElement("div");
  document.body.appendChild(container);
  t.add_cleanup(() => {
    container.remove();
  });

  const el = document.createElement(testCase.tag);
  container.appendChild(el);

  if (testCase.tag === "iframe") {
    await new Promise(resolve => {
      el.addEventListener("load", () => {
        resolve();
      }, { once: true });
      el.src = "about:blank";
    });
  }

  if (testCase.setup) {
    testCase.setup(el, container);
  }

  el.focus();
  assert_equals(
    document.activeElement,
    el,
    "Precondition: The element should receive focus initially."
  );

  return { el, container };
}

function assertFocusFixup(el) {
  assert_not_equals(
    document.activeElement,
    el,
    "The element should no longer be the activeElement after the trigger is fired."
  );
  assert_equals(
    document.activeElement,
    document.body,
    "The focus should fall back to the viewport (document.body) due to the focus-fixup-rule."
  );
}

function recordEventType(e) {
  this.events.push(e.type);
}

function setupEventRecording(t) {
  const recorder = {
    events: [],
    handleEvent: recordEventType
  };

  for (const type of ["blur", "focusout", "focus", "focusin"]) {
    window.addEventListener(type, recorder, { capture: true });
    t.add_cleanup(() => {
      window.removeEventListener(type, recorder, { capture: true });
    });
  }

  return recorder.events;
}

for (const testCase of testCases) {
  if (testCase.isAsync) {
    // Tests that require asynchronous focus fixup evaluation
    promise_test(async t => {
      const { el, container } = await prepareTestEnvironment(t, testCase);
      const events = setupEventRecording(t);

      testCase.trigger(el, container);

      await new Promise(resolve => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resolve);
        });
      });

      assertFocusFixup(el);
      assert_not_equals(events.length, 0, "Focus-related events should be fired during asynchronous focus fixup.");
    }, `[Async] focus-fixup-rule: ${testCase.name}`);
  } else {
    // Tests that should synchronously fix up focus (only DOM removal)
    promise_test(async t => {
      const { el, container } = await prepareTestEnvironment(t, testCase);
      const events = setupEventRecording(t);

      testCase.trigger(el, container);

      // Assert immediately without waiting for any microtasks or rendering updates
      assertFocusFixup(el);
      assert_array_equals(
        events,
        [],
        "No focus-related events should be fired when the focused element is removed from the DOM (!isConnected)."
      );
    }, `[Sync] focus-fixup-rule: ${testCase.name}`);
  }
}
</script>
