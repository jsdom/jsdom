<!DOCTYPE html>
<meta charset="utf-8">
<title>Focusing steps: display: none of the element and its ancestors follows the cascade and CSSOM changes</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#focusable-area">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<input id="default-input">
<div id="container"></div>

<script>
"use strict";

function setupTree(t, css, html) {
  const style = document.createElement("style");
  style.textContent = css;
  document.head.append(style);

  const container = document.getElementById("container");
  container.innerHTML = html;

  t.add_cleanup(() => {
    style.remove();
    container.textContent = "";
    document.getElementById("default-input").focus();
    document.getElementById("default-input").blur();
  });

  return { sheet: style.sheet, input: container.querySelector("input") };
}

function assert_focusable(input, description) {
  input.focus();
  assert_equals(document.activeElement, input, description);
  input.blur();
}

function assert_not_focusable(input, description) {
  input.focus();
  assert_not_equals(document.activeElement, input, description);
}

test(t => {
  const { input } = setupTree(t, `
    #ancestor { display: block; }
    .hide { display: none; }
  `, `<div id="ancestor" class="hide"><input></div>`);
  assert_focusable(input, "The more specific display: block should win");
}, "A more specific display value on an ancestor overrides display: none");

test(t => {
  const { input } = setupTree(t, `
    .show { display: block; }
    .hide { display: none; }
  `, `<div class="show hide"><input></div>`);
  assert_not_focusable(input, "The later display: none should win");
}, "A later display: none of the same specificity applies to an ancestor");

test(t => {
  const { input } = setupTree(t, `
    .hide { display: none !important; }
    #ancestor { display: block; }
  `, `<div id="ancestor" class="hide" style="display: block"><input></div>`);
  assert_not_focusable(input, "The important display: none should win");
}, "An important display: none beats more specific and inline declarations");

test(t => {
  const { input } = setupTree(t, `
    .hide { display: none !important; }
  `, `<div class="hide" style="display: block !important"><input></div>`);
  assert_focusable(input, "The important inline display: block should win");
}, "An important inline display value beats an important display: none");

test(t => {
  const { input } = setupTree(t, `
    #ancestor { display: unset; }
  `, `<div id="ancestor" hidden><input></div>`);
  assert_focusable(input, "display: unset should override the hidden attribute");
}, "A CSS-wide keyword overrides display: none from the hidden attribute");

test(t => {
  const { sheet, input } = setupTree(t, `
    .ancestor { color: red; }
  `, `<div class="ancestor"><input></div>`);
  assert_focusable(input, "Before the declaration is added");

  sheet.cssRules[0].style.display = "none";
  assert_not_focusable(input, "After the declaration is added");

  sheet.cssRules[0].style.removeProperty("display");
  assert_focusable(input, "After the declaration is removed");
}, "Adding and removing display: none in an existing rule applies to focus");

test(t => {
  const { sheet, input } = setupTree(t, `
    .ancestor { color: red; }
  `, `<div class="ancestor"><input></div>`);
  assert_focusable(input, "Before the rule is inserted");

  sheet.insertRule(".ancestor { display: none; }", 1);
  assert_not_focusable(input, "After the rule is inserted");

  sheet.deleteRule(1);
  assert_focusable(input, "After the rule is deleted");
}, "Inserting and deleting a display: none rule applies to focus");

test(t => {
  const { sheet, input } = setupTree(t, `
    .other { display: none; }
  `, `<div class="ancestor"><input></div>`);
  assert_focusable(input, "Before the selector is changed");

  sheet.cssRules[0].selectorText = ".ancestor";
  assert_not_focusable(input, "After the selector is changed");
}, "Changing the selector of a display: none rule applies to focus");

test(t => {
  const { sheet, input } = setupTree(t, `
    @media screen {
      .ancestor { display: none; }
    }
  `, `<div class="ancestor"><input></div>`);
  assert_not_focusable(input, "While the media query matches");

  sheet.cssRules[0].media.mediaText = "print";
  assert_focusable(input, "After the media query stops matching");
}, "display: none in a media rule applies to focus while the media query matches");
</script>
