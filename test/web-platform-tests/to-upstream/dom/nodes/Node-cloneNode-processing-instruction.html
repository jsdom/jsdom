<!doctype html>
<meta charset="utf-8">
<title>Cloning processing instructions preserves data containing the processing instruction terminator</title>
<link rel="help" href="https://dom.spec.whatwg.org/#clone-a-single-node">
<link rel="help" href="https://dom.spec.whatwg.org/#dom-document-importnode">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

for (const method of ["cloneNode", "importNode"]) {
  test(() => {
    const xmlDocument = document.implementation.createDocument(null, "root");
    const original = xmlDocument.createProcessingInstruction("target", "");
    original.data = "a?>b";

    const copy = method === "cloneNode" ? original.cloneNode() : document.importNode(original);

    assert_not_equals(copy, original);
    assert_true(copy instanceof ProcessingInstruction);
    assert_equals(copy.ownerDocument, method === "cloneNode" ? xmlDocument : document);
    assert_equals(copy.target, "target");
    assert_equals(copy.data, "a?>b");
    assert_equals(original.ownerDocument, xmlDocument);
    assert_equals(original.data, "a?>b");
  }, `${method} preserves processing instruction data containing "?>"`);
}
</script>
