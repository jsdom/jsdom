<!DOCTYPE html>
<meta charset="utf-8">
<title>HTML Test: focus-fixup-rule</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#focus-fixup-rule">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div id="log"></div>

<script>
"use strict";

const testCases = [
  {
    name: "1. When the element is removed from the DOM",
    tag: "button",
    setup: el => {
      el.textContent = "Remove";
    },
    trigger: el => {
      el.remove();
    }
  },
  {
    name: "2. When the disabled attribute is added",
    tag: "button",
    setup: el => {
      el.textContent = "Disable";
    },
    trigger: el => {
      el.disabled = true;
    }
  },
  {
    name: "3. When the tabindex attribute is removed",
    tag: "div",
    setup: el => {
      el.tabIndex = 0;
      el.textContent = "Tabindex";
    },
    trigger: el => {
      el.removeAttribute("tabindex");
    }
  },
  {
    name: "4. When the contenteditable attribute is removed",
    tag: "div",
    setup: el => {
      el.setAttribute("contenteditable", "true");
      el.textContent = "Editable";
    },
    trigger: el => {
      el.removeAttribute("contenteditable");
    }
  },
  {
    name: "5. When the inert attribute is added to the element itself",
    tag: "button",
    setup: el => {
      el.textContent = "Inert";
    },
    trigger: el => {
      el.inert = true;
    }
  },
  {
    name: "6. When the inert attribute is added to an ancestor element",
    tag: "button",
    setup: el => {
      el.textContent = "Ancestor Inert";
    },
    trigger: (el, container) => {
      container.inert = true;
    }
  },
  {
    name: "7. When display: none is applied via CSS",
    tag: "button",
    setup: el => {
      el.textContent = "Display None";
    },
    trigger: el => {
      el.style.display = "none";
    }
  },
  {
    name: "8. When visibility: hidden is applied via CSS",
    tag: "button",
    setup: el => {
      el.textContent = "Visibility Hidden";
    },
    trigger: el => {
      el.style.visibility = "hidden";
    }
  },
  {
    name: "9. When the type of an input element is changed to hidden",
    tag: "input",
    setup: el => {
      el.type = "text";
    },
    trigger: el => {
      el.type = "hidden";
    }
  },
  {
    name: "10. When the hidden attribute is added",
    tag: "button",
    setup: el => {
      el.textContent = "Hidden Attribute";
    },
    trigger: el => {
      el.hidden = true;
    }
  }
];

for (const testCase of testCases) {
  promise_test(async t => {
    const container = document.createElement("div");
    document.body.appendChild(container);
    t.add_cleanup(() => {
      container.remove();
    });

    const el = document.createElement(testCase.tag);
    container.appendChild(el);
    if (testCase.setup) {
      testCase.setup(el, container);
    }

    el.focus();
    assert_equals(
      document.activeElement,
      el,
      "Precondition: The element should receive focus initially."
    );

    testCase.trigger(el, container);

    await new Promise(resolve => {
      requestAnimationFrame(() => {
        requestAnimationFrame(resolve);
      });
    });

    assert_not_equals(
      document.activeElement,
      el,
      "The element should no longer be the activeElement after the trigger is fired."
    );
    assert_equals(
      document.activeElement,
      document.body,
      "The focus should fall back to the viewport (document.body) due to the focus-fixup-rule."
    );
  }, `focus-fixup-rule: ${testCase.name}`);
}
</script>
