<!doctype html>
<meta charset="utf-8">
<title>Blob URL loading and revocation without fetch or navigation</title>
<link rel="help" href="https://w3c.github.io/FileAPI/#requestResponseModel">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- Adapted from /FileAPI/url/url-in-tags-revoke.window.js, url-lifetime.html, and cross-global-revoke.sub.html.
     Those files require navigation, fetch(), or Workers and cannot yet enforce these assertions in jsdom. -->
<body>
<script>
"use strict";

function load(element) {
  return new Promise((resolve, reject) => {
    element.onload = resolve;
    element.onerror = reject;
    document.body.append(element);
  });
}

function read(url) {
  const xhr = new XMLHttpRequest();
  xhr.open("GET", url, false);
  xhr.send();
  return xhr.responseText;
}

promise_test(async t => {
  const url = URL.createObjectURL(new Blob(["window.blobScriptLoaded = true;"]));
  const script = document.createElement("script");
  t.add_cleanup(() => script.remove());
  t.add_cleanup(() => URL.revokeObjectURL(url));
  t.add_cleanup(() => {
    delete window.blobScriptLoaded;
  });
  script.src = url;
  const loaded = load(script);
  URL.revokeObjectURL(url);
  await loaded;
  assert_true(window.blobScriptLoaded);
}, "A script retains its blob when the URL is revoked after insertion");

promise_test(async t => {
  const blob = new Blob(["<!doctype html><p id='result'>iframe contents</p>"], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const frame = document.createElement("iframe");
  t.add_cleanup(() => frame.remove());
  t.add_cleanup(() => URL.revokeObjectURL(url));
  frame.src = url;
  const loaded = load(frame);
  URL.revokeObjectURL(url);
  await loaded;
  assert_equals(frame.contentDocument.querySelector("#result").textContent, "iframe contents");
  assert_equals(frame.contentDocument.contentType, "text/html");
}, "An iframe retains its blob and inherits its origin");

test(t => {
  const frame = document.createElement("iframe");
  document.body.append(frame);
  t.add_cleanup(() => frame.remove());
  const url = URL.createObjectURL(new Blob(["parent"]));
  t.add_cleanup(() => URL.revokeObjectURL(url));
  frame.contentWindow.URL.revokeObjectURL(url);
  assert_throws_dom("NetworkError", () => read(url));
}, "A same-origin iframe can revoke a parent blob URL");

test(t => {
  const frame = document.createElement("iframe");
  document.body.append(frame);
  t.add_cleanup(() => frame.remove());
  const url = frame.contentWindow.URL.createObjectURL(new Blob(["child"]));
  const xhr = new XMLHttpRequest();
  xhr.open("GET", url, false);
  assert_equals(read(url), "child");
  frame.remove();
  xhr.send();
  assert_equals(xhr.responseText, "child");
  assert_throws_dom("NetworkError", () => read(url));
}, "Removing an iframe revokes its URLs while retaining previously opened requests");

</script>
