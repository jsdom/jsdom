<!doctype html>
<meta charset="utf-8">
<title>Blob URLs in element resource loading</title>
<link rel="help" href="https://w3c.github.io/FileAPI/#requestResponseModel">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";

function load(element) {
  return new Promise((resolve, reject) => {
    element.onload = resolve;
    element.onerror = reject;
    document.body.append(element);
  });
}

promise_test(async t => {
  const url = URL.createObjectURL(new Blob(["#styled { color: rgb(1, 2, 3); }"], { type: "text/css" }));
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = url;
  const target = document.createElement("p");
  target.id = "styled";
  document.body.append(target);
  t.add_cleanup(() => target.remove());
  t.add_cleanup(() => link.remove());
  t.add_cleanup(() => URL.revokeObjectURL(url));
  await load(link);
  URL.revokeObjectURL(url);
  assert_equals(getComputedStyle(target).color, "rgb(1, 2, 3)");
}, "A stylesheet can be loaded from a blob URL");

promise_test(async t => {
  const url = URL.createObjectURL(new Blob(["window.revokedScriptRan = true;"]));
  URL.revokeObjectURL(url);
  const script = document.createElement("script");
  script.src = url;
  t.add_cleanup(() => script.remove());
  await new Promise((resolve, reject) => {
    script.onerror = resolve;
    script.onload = reject;
    document.body.append(script);
  });
  assert_equals(window.revokedScriptRan, undefined);
}, "A revoked blob URL dispatches an element error event");
</script>
