<!DOCTYPE html>
<html lang="en-US">
<meta charset="utf-8">
<title>CSS Selectors 4 - :lang matching (matches API)</title>
<link rel="author" title="Jonathan Kew" href="mailto:jkew@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/selectors-4/#the-lang-pseudo">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/8720">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div class="test"><span lang="x-lojban">This should be green</span></div>

<script>
test(() => {
  const span = document.querySelector("span");
  assert_false(span.matches(':lang("x")'), "An incomplete private-use range must not match");
  assert_true(span.matches(':lang("x-lojban")'), "A complete private-use range must match");
}, "Private-use language matching requires a complete range");
</script>
</html>
