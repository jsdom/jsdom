<!DOCTYPE html>
<meta charset="utf-8">
<title>test for details:open pseudoclass (matches API)</title>
<link rel="help" href="https://drafts.csswg.org/selectors-4/#open-state">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<details>
  <summary>Summary</summary>
  <p>Detailed content</p>
</details>

<script>
test(() => {
  const details = document.querySelector("details");
  assert_equals(details.matches(":open"), false, "initially closed details should not match :open");

  details.open = true;
  assert_equals(details.matches(":open"), true, "details element opened via script should match :open");
}, "details element opened via script matches :open");
</script>
