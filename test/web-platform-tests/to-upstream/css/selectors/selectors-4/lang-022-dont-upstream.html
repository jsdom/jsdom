<!DOCTYPE html>
<html lang="en-US">
<meta charset="utf-8">
<title>CSS Selectors 4 - :lang matching (matches API)</title>
<link rel="author" title="Jonathan Kew" href="mailto:jkew@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/selectors-4/#the-lang-pseudo">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div class="test"><span lang="i-navajo">This should be green</span></div>

<script>
test(() => {
  const span = document.querySelector("span");
  assert_equals(span.matches(':lang("i-navajo")'), true, "Element with grandfathered lang='i-navajo' should match :lang('i-navajo')");
}, "Grandfathered language tag matching");
</script>
</html>
