<!DOCTYPE html>
<html lang="en-US">
<meta charset="utf-8">
<title>CSS Selectors 4 - :lang matching (matches API)</title>
<link rel="author" title="Jonathan Kew" href="mailto:jkew@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/selectors-4/#the-lang-pseudo">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div class="test" lang="en-GB-oed"><span><span>This should be green</span></span></div>

<script>
test(() => {
  const innerSpan = document.querySelector("span span");
  assert_equals(innerSpan.matches(':lang("*-gb")'), true, "Descendant element inheriting lang='en-GB-oed' should match wildcard subtag :lang('*-gb')");
}, "Inherited lang attribute matches wildcard subtag");
</script>
</html>
