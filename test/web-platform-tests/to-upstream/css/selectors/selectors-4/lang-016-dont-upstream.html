<!DOCTYPE html>
<html lang="en-US">
<meta charset="utf-8">
<title>CSS Selectors 4 - :lang matching (matches API)</title>
<link rel="author" title="Jonathan Kew" href="mailto:jkew@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/selectors-4/#the-lang-pseudo">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div class="test"><span lang="fr-FR-x-foobar">This should be green</span></div>

<script>
test(() => {
  const span = document.querySelector("span");
  assert_equals(span.matches(':lang(fr)'), true, "Element with lang='fr-FR-x-foobar' should match base language :lang(fr)");
}, "Private use subtag trailing match for base language");
</script>
</html>
