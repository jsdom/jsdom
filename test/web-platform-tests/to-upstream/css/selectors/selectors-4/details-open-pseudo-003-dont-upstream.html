<!DOCTYPE html>
<meta charset="utf-8">
<title>test for details:open pseudoclass (matches API)</title>
<link rel="help" href="https://drafts.csswg.org/selectors-4/#open-state">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<details open=true>
  <summary>Summary</summary>
  <p>Detailed content</p>
</details>

<script>
test(() => {
  const details = document.querySelector("details");
  assert_equals(details.matches(":open"), true, "initially open details should match :open");

  details.open = false;
  assert_equals(details.matches(":open"), false, "details element closed via script should not match :open");
}, "details element closed via script does not match :open");
</script>
