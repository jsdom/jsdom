<!DOCTYPE html>
<meta charset="utf-8">
<title>Selector specificity, source order, and inline styles</title>
<link rel="author" title="Sebastian Silbermann" href="mailto:silbermann.sebastian@gmail.com">
<link rel="help" href="https://drafts.csswg.org/selectors/#specificity-rules">
<link rel="help" href="https://drafts.csswg.org/css-cascade/#cascade-sort">
<!-- Tests from https://github.com/jsdom/jsdom/pull/2690 -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<style>
  #foo > #test1 {
    text-align: left;
  }

  #test1 {
    text-align: right;
  }

  #test2.center {
    text-align: center;
  }

  #test2 {
    text-align: left;
  }

  .test3--left.test3--right {
    text-align: right;
  }

  .test3--left {
    text-align: left;
  }

  .test4--left {
    text-align: left;
  }

  .test4--right {
    text-align: right;
  }

  #test5[data-align="right"] {
    text-align: right;
  }

  #test5 {
    text-align: left;
  }

  #test6.specific {
    text-align: left;
  }

  #test6.very.specific, #test6 {
    text-align: right;
  }

  .left-align {
    text-align: left;
  }
</style>

<body>
  <div id="foo">
    <div id="test1"></div>
  </div>
  <div id="test2" class="center"></div>
  <div id="test3" class="test3--left test3--right"></div>
  <div id="test4" class="test4--left test4--right"></div>
  <div id="test5" data-align="right"></div>
  <div id="test6" class="very specific"></div>
  <button>
    <span class="left-align" style="text-align: right;" id="inline-over-sheet"></span>
  </button>
</body>

<script>
"use strict";

test(() => {
  const element = document.querySelector("#test1");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "left");
}, "Two ID selectors outrank one ID selector");

test(() => {
  const element = document.querySelector("#test2");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "center");
}, "An ID and a class outrank an ID alone");

test(() => {
  const element = document.querySelector("#test3");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "right");
}, "Two classes outrank one class");

test(() => {
  const element = document.querySelector("#test4");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "right");
}, "Later rules win when specificity is equal");

test(() => {
  const element = document.querySelector("#test5");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "right");
}, "An ID and an attribute outrank an ID alone");

test(() => {
  const element = document.querySelector("#test6");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "right");
}, "The most specific matching selector in a list determines specificity");

test(() => {
  const element = document.querySelector("#inline-over-sheet");
  assert_equals(getComputedStyle(element).getPropertyValue("text-align"), "right");
}, "A normal inline style overrides a normal stylesheet declaration");
</script>
