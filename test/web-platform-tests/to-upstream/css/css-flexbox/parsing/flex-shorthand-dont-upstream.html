<!DOCTYPE html>
<meta charset="utf-8">
<title>Additional flex shorthand parsing cases</title>
<link rel="help" href="https://drafts.csswg.org/css-flexbox/#propdef-flex">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- These additions are submitted to `css/css-flexbox/parsing/flex-shorthand.html` in https://github.com/web-platform-tests/wpt/pull/62514.
     Remove this local companion once the rolled upstream test enforces them. -->
<!-- Also retain `none`: it is already upstream, but jsdom does not run the pinned flex parsing directory. -->
<script src="/css/support/shorthand-testcommon.js"></script>
<script>
"use strict";
/* global test_shorthand_value */

test_shorthand_value("flex", "none", {
  "flex-grow": "0",
  "flex-shrink": "0",
  "flex-basis": "auto"
});

test_shorthand_value("flex", "auto", {
  "flex-grow": "1",
  "flex-shrink": "1",
  "flex-basis": "auto"
});

test_shorthand_value("flex", "0 1 250px", {
  "flex-grow": "0",
  "flex-shrink": "1",
  "flex-basis": "250px"
});

test_shorthand_value("flex", "0 0 auto", {
  "flex-grow": "0",
  "flex-shrink": "0",
  "flex-basis": "auto"
});

test_shorthand_value("flex", "0 auto", {
  "flex-grow": "0",
  "flex-shrink": "1",
  "flex-basis": "auto"
});

test_shorthand_value("flex", "2", {
  "flex-grow": "2",
  "flex-shrink": "1",
  "flex-basis": "0%"
});

test_shorthand_value("flex", "20%", {
  "flex-grow": "1",
  "flex-shrink": "1",
  "flex-basis": "20%"
});

test_shorthand_value("flex", "2 2", {
  "flex-grow": "2",
  "flex-shrink": "2",
  "flex-basis": "0%"
});
</script>
