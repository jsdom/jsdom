<!doctype html>
<meta charset="utf-8">
<title>Rules reach the elements and pseudo-elements their selectors can match</title>
<link rel="help" href="https://drafts.csswg.org/css-cascade/#cascade-sort">
<link rel="help" href="https://drafts.csswg.org/selectors/#child-combinators">
<link rel="help" href="https://drafts.csswg.org/selectors/#attribute-selectors">
<link rel="help" href="https://drafts.csswg.org/css-pseudo/#treelike">
<link rel="help" href="https://drafts.csswg.org/css-scoping/#slotted-pseudo">
<link rel="help" href="https://drafts.csswg.org/css-shadow-parts/#part">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";

function fixture(t, rules, html) {
  const style = document.createElement("style");
  style.textContent = rules;
  document.head.append(style);
  const container = document.createElement("div");
  container.innerHTML = html;
  document.body.append(container);
  t.add_cleanup(() => {
    container.remove();
    style.remove();
  });
  return container;
}

function color(element) {
  return getComputedStyle(element).color;
}

function background(element) {
  return getComputedStyle(element).backgroundColor;
}

function borderTop(element) {
  return getComputedStyle(element).borderTopColor;
}

test(t => {
  const container = fixture(t, `
    [data-a] { color: red; }
    .c { color: blue; }
    [data-a] { color: green; }
    .c { background-color: blue; }
    [data-b] { background-color: green; }
  `, `<span class="c" data-a data-b></span>`);
  const span = container.firstChild;
  assert_equals(color(span), "rgb(0, 128, 0)");
  assert_equals(background(span), "rgb(0, 128, 0)");
}, "Attribute-selector rules keep source order with class-selector rules");

test(t => {
  const container = fixture(t, `
    [DATA-UPPER] { color: green; }
    [class^="hl-"] { background-color: green; }
  `, `<span data-upper class="hl-x"></span>`);
  const span = container.firstChild;
  assert_equals(color(span), "rgb(0, 128, 0)");
  assert_equals(background(span), "rgb(0, 128, 0)");
}, "Attribute-selector rules match HTML attribute names case-insensitively");

test(t => {
  const container = fixture(t, `
    .p > * { background-color: green; }
    .p > *:not(:has(b)) { border-top-color: green; }
  `, `<div class="p"><span><i></i></span><em><b></b></em></div><div class="q"><span></span></div>`);
  const [span, em] = container.querySelector(".p").children;
  assert_equals(background(span), "rgb(0, 128, 0)", "child");
  assert_equals(background(span.firstChild), "rgba(0, 0, 0, 0)", "grandchild");
  assert_equals(background(container.querySelector(".q > span")), "rgba(0, 0, 0, 0)", "child of another parent");
  assert_equals(borderTop(span), "rgb(0, 128, 0)");
  assert_equals(borderTop(em), "rgb(0, 0, 0)");
}, "Universal subjects match through a child combinator's parent");

test(t => {
  const container = fixture(t, `.p > span { color: green; } .p > * { background-color: green; }`, `<div class="p"><span></span></div><div class="q"></div>`);
  const span = container.querySelector("span");
  assert_equals(color(span), "rgb(0, 128, 0)");
  container.querySelector(".q").append(span);
  assert_equals(color(span), "rgb(0, 0, 0)", "after moving to another parent");
  assert_equals(background(span), "rgba(0, 0, 0, 0)");
  container.querySelector(".q").className = "p";
  assert_equals(color(span), "rgb(0, 128, 0)", "after the parent gains the class");
}, "Child-combinator rules follow parent changes");

test(t => {
  const container = fixture(t, `.host > span { color: red; } .host > * { background-color: red; }`, `<div class="host"><span slot="s"></span></div>`);
  const host = container.firstChild;
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>:host > * { color: green; }</style><span></span><slot name="s"></slot>`;
  const shadowSpan = root.querySelector("span");
  assert_equals(color(shadowSpan), "rgb(0, 128, 0)", "the shadow tree's :host > * rule applies");
  assert_equals(background(shadowSpan), "rgba(0, 0, 0, 0)", "document rules do not reach shadow children");
  assert_equals(color(host.firstChild), "rgb(255, 0, 0)", "the host's light child matches");
}, "Child-combinator rules do not treat a shadow host as the parent of its shadow children");

test(t => {
  const container = fixture(t, `
    .x { color: blue; }
    @media all { .x { color: green; } }
    @media all { .y { background-color: red; } }
    .y { background-color: green; }
    @supports (display: block) { @layer l { [data-a] { border-top-color: green; } } }
    @media all { * { outline-color: green; } }
  `, `<span class="x y" data-a></span>`);
  const span = container.firstChild;
  assert_equals(color(span), "rgb(0, 128, 0)");
  assert_equals(background(span), "rgb(0, 128, 0)");
  assert_equals(borderTop(span), "rgb(0, 128, 0)");
  assert_equals(getComputedStyle(span).outlineColor, "rgb(0, 128, 0)");
}, "Rules inside conditional groups keep source order and reach matching elements");

test(t => {
  const container = fixture(t, `@media not all { .x { color: red; } }`, `<span class="x"></span>`);
  assert_equals(color(container.firstChild), "rgb(0, 0, 0)");
}, "Rules inside a conditional group still require its condition");

test(t => {
  const container = fixture(t, `@media all { } @media all { .x { color: red; } } .p > * { }`, `<div class="p"><span class="x" data-a></span></div>`);
  const span = container.querySelector("span");
  const { sheet } = document.head.lastElementChild;
  assert_equals(color(span), "rgb(255, 0, 0)");
  sheet.cssRules[1].insertRule("[data-a] { color: green; }", 1);
  assert_equals(color(span), "rgb(0, 128, 0)", "after inserting into a group");
  sheet.cssRules[1].cssRules[1].selectorText = ".nope";
  assert_equals(color(span), "rgb(255, 0, 0)", "after retargeting a rule in a group");
  sheet.cssRules[0].insertRule(".x { background-color: green; }");
  assert_equals(background(span), "rgb(0, 128, 0)", "after inserting into an empty group");
  sheet.cssRules[2].selectorText = ".p > span";
  sheet.cssRules[2].style.borderTopColor = "green";
  assert_equals(borderTop(span), "rgb(0, 128, 0)", "after retargeting a child-combinator rule");
}, "Rule candidates follow CSSOM changes");

test(t => {
  const container = fixture(t, `
    .a::before { content: "a"; color: green; }
    span::before { background-color: green; }
    .p > *::after { content: "p"; }
    .a, .a::after { border-top-color: green; }
    li::marker { color: green; }
  `, `<div class="p"><span class="a"></span></div><ul><li></li></ul>`);
  const span = container.querySelector("span");
  const before = getComputedStyle(span, "::before");
  assert_equals(before.content, '"a"');
  assert_equals(before.color, "rgb(0, 128, 0)");
  assert_equals(before.backgroundColor, "rgb(0, 128, 0)");
  assert_equals(getComputedStyle(span, "::after").content, '"p"', "child combinator");
  assert_equals(getComputedStyle(span, "::after").borderTopColor, "rgb(0, 128, 0)", "selector list");
  assert_equals(borderTop(span), "rgb(0, 128, 0)", "selector list's element selector");
  assert_equals(color(span), "rgb(0, 0, 0)", "pseudo-element rules do not reach the element");
  assert_equals(getComputedStyle(container.querySelector("li"), "::marker").color, "rgb(0, 128, 0)");
}, "Pseudo-element rules reach pseudo-elements through their originating element");

test(t => {
  const container = fixture(t, `
    .host::part(p) { color: green; }
    .host::part(p)::after { content: "part"; }
  `, `<div class="host"><span slot="s"></span></div>`);
  const host = container.firstChild;
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `
    <style>::slotted(span) { color: green; } ::slotted(span)::before { content: "slotted"; }</style>
    <slot name="s"></slot><b part="p"></b>
  `;
  const slotted = host.firstChild;
  const part = root.querySelector("b");
  assert_equals(color(slotted), "rgb(0, 128, 0)");
  assert_equals(getComputedStyle(slotted, "::before").content, '"slotted"');
  assert_equals(color(part), "rgb(0, 128, 0)");
  assert_equals(getComputedStyle(part, "::after").content, '"part"');
}, "::slotted() and ::part() rules reach elements and their pseudo-elements");

function sheets(t, ...rules) {
  const styles = rules.map(text => {
    const style = document.createElement("style");
    style.textContent = text;
    document.head.append(style);
    return style;
  });
  t.add_cleanup(() => {
    for (const style of styles) {
      style.remove();
    }
  });
  return styles;
}

test(t => {
  sheets(
    t,
    `.c { color: red; }`,
    `* { color: red; background-color: red; }`,
    `@keyframes k { from { color: red; } }`,
    `[data-a] { color: green; }`,
    `@font-face { font-family: f; src: local(f); }`,
    `span { background-color: green; }`,
    `.other { color: red; background-color: red; }`,
    `@media all { .c { border-top-color: green; } }`,
    `.c { & { outline-color: green; } }`
  );
  const container = fixture(t, ``, `<span class="c" data-a></span>`);
  const span = container.firstChild;
  assert_equals(color(span), "rgb(0, 128, 0)");
  assert_equals(background(span), "rgb(0, 128, 0)");
  assert_equals(borderTop(span), "rgb(0, 128, 0)");
  assert_equals(getComputedStyle(span).outlineColor, "rgb(0, 128, 0)");
}, "Rules in separate style sheets keep style sheet order");

test(t => {
  const [first, second, third] = sheets(t, `.c { color: red; }`, ``, `.c::before { content: "a"; }`);
  const container = fixture(t, ``, `<span class="c"></span>`);
  const span = container.firstChild;
  assert_equals(color(span), "rgb(255, 0, 0)");
  second.sheet.insertRule(".c { color: green; }");
  assert_equals(color(span), "rgb(0, 128, 0)", "after inserting into an empty style sheet");
  second.sheet.cssRules[0].selectorText = ".nope";
  assert_equals(color(span), "rgb(255, 0, 0)", "after retargeting the rule");
  second.textContent = ".c { color: green; }";
  assert_equals(color(span), "rgb(0, 128, 0)", "after replacing the style sheet");
  second.sheet.disabled = true;
  assert_equals(color(span), "rgb(255, 0, 0)", "after disabling the style sheet");
  second.sheet.disabled = false;
  first.before(second);
  assert_equals(color(span), "rgb(255, 0, 0)", "after moving the style sheet first");
  first.remove();
  assert_equals(color(span), "rgb(0, 128, 0)", "after removing the later style sheet");
  third.sheet.insertRule(".c::before { content: 'b'; }", 1);
  assert_equals(getComputedStyle(span, "::before").content, '"b"');
  const adopted = new CSSStyleSheet();
  adopted.replaceSync(".c { color: blue; }");
  document.adoptedStyleSheets = [adopted];
  t.add_cleanup(() => {
    document.adoptedStyleSheets = [];
  });
  assert_equals(color(span), "rgb(0, 0, 255)", "after adopting a style sheet");
  adopted.replaceSync(".d { color: blue; }");
  assert_equals(color(span), "rgb(0, 128, 0)", "after replacing the adopted style sheet's rules");
}, "Style sheet candidates follow style sheet changes");

test(t => {
  const container = fixture(t, ``, `<div class="host"><span slot="s" class="c"></span></div>`);
  const host = container.firstChild;
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `
    <style>.c { color: red; }</style>
    <style>:host { background-color: green; }</style>
    <style>::slotted(.c) { color: green; }</style>
    <style>.host { background-color: red; }</style>
    <style>b { color: green; }</style>
    <slot name="s"></slot><b></b>
  `;
  assert_equals(color(host.firstChild), "rgb(0, 128, 0)", "slotted element");
  assert_equals(background(host), "rgb(0, 128, 0)", "host");
  assert_equals(color(root.querySelector("b")), "rgb(0, 128, 0)", "shadow tree element");
}, "Separate style sheets in a shadow tree reach its host and slotted elements");
</script>
