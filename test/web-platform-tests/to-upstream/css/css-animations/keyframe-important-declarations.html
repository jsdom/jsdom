<!doctype html>
<meta charset="utf-8">
<title>Keyframe declarations ignore important declarations</title>
<link rel="help" href="https://drafts.csswg.org/css-animations-1/#keyframes">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

for (const declarations of ["opacity: 0 !important; opacity: 1", "opacity: 1; opacity: 0 !important"]) {
  test(t => {
    const element = document.createElement("style");
    element.textContent = `@keyframes example { from { ${declarations} } }`;
    document.head.append(element);
    t.add_cleanup(() => element.remove());
    const { style } = element.sheet.cssRules[0].cssRules[0];
    assert_equals(style.opacity, "1");
    assert_equals(style.getPropertyPriority("opacity"), "");
  }, `Stylesheet keyframes ignore important declarations in ${declarations}`);

  test(t => {
    const element = document.createElement("style");
    element.textContent = "@keyframes example {}";
    document.head.append(element);
    t.add_cleanup(() => element.remove());
    const rule = element.sheet.cssRules[0];
    rule.appendRule(`from { ${declarations} }`);
    assert_equals(rule.cssRules[0].style.opacity, "1");
    assert_equals(rule.cssRules[0].style.getPropertyPriority("opacity"), "");
  }, `appendRule() ignores important declarations in ${declarations}`);

  test(t => {
    const element = document.createElement("style");
    element.textContent = "@keyframes example { from {} }";
    document.head.append(element);
    t.add_cleanup(() => element.remove());
    const { style } = element.sheet.cssRules[0].cssRules[0];
    style.cssText = declarations;
    assert_equals(style.opacity, "1");
    assert_equals(style.getPropertyPriority("opacity"), "");
  }, `Setting keyframe cssText ignores important declarations in ${declarations}`);
}
</script>
