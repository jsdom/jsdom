<!doctype html>
<meta charset="utf-8">
<title>Computed style after removing inline declaration importance through CSSOM</title>
<link rel="help" href="https://drafts.csswg.org/cssom/#dom-cssstyledeclaration-setproperty">
<link rel="help" href="https://drafts.csswg.org/cssom/#set-a-css-declaration">
<link rel="help" href="https://drafts.csswg.org/css-cascade-5/#cascade-sort">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #target { margin-left: 5px !important; }
</style>
<body>
<script>
"use strict";

function fixture(t, inlineStyle) {
  const element = document.createElement("div");
  element.id = "target";
  element.style.cssText = inlineStyle;
  document.body.append(element);
  t.add_cleanup(() => element.remove());
  assert_equals(getComputedStyle(element).marginLeft, "1px", "The important inline declaration initially wins");
  return element;
}

test(t => {
  const element = fixture(t, "margin-left: 1px !important");
  element.style.marginLeft = "2px";

  assert_equals(element.style.marginLeft, "2px");
  assert_equals(element.style.getPropertyPriority("margin-left"), "");
  assert_equals(getComputedStyle(element).marginLeft, "5px", "The important stylesheet declaration now wins");
}, "Property assignment clears an inline longhand's importance and updates the cascade");

test(t => {
  const element = fixture(t, "margin-left: 1px !important");
  element.style.setProperty("margin-left", "2px");

  assert_equals(element.style.marginLeft, "2px");
  assert_equals(element.style.getPropertyPriority("margin-left"), "");
  assert_equals(getComputedStyle(element).marginLeft, "5px", "The important stylesheet declaration now wins");
}, "setProperty() without priority clears an inline longhand's importance and updates the cascade");

test(t => {
  const element = fixture(t, "margin: 1px !important");
  element.style.marginLeft = "2px";

  assert_equals(element.style.marginLeft, "2px");
  assert_equals(element.style.getPropertyPriority("margin-left"), "");
  assert_equals(element.style.marginTop, "1px");
  assert_equals(element.style.getPropertyPriority("margin-top"), "important");
  assert_equals(getComputedStyle(element).marginLeft, "5px", "The important stylesheet declaration now wins");
  assert_equals(getComputedStyle(element).marginTop, "1px");
}, "Property assignment clears one inline shorthand longhand's importance and updates the cascade");

test(t => {
  const element = fixture(t, "margin: 1px !important");
  element.style.setProperty("margin-left", "2px");

  assert_equals(element.style.marginLeft, "2px");
  assert_equals(element.style.getPropertyPriority("margin-left"), "");
  assert_equals(element.style.marginTop, "1px");
  assert_equals(element.style.getPropertyPriority("margin-top"), "important");
  assert_equals(getComputedStyle(element).marginLeft, "5px", "The important stylesheet declaration now wins");
  assert_equals(getComputedStyle(element).marginTop, "1px");
}, "setProperty() without priority clears one inline shorthand longhand's importance and updates the cascade");
</script>
