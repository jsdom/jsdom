<!DOCTYPE html>
<meta charset="utf-8">
<title>Stylesheet rules between HTML comment markers remain active</title>
<link rel="help" href="https://drafts.csswg.org/css-syntax-3/#parsing">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- Regression test for https://github.com/jsdom/jsdom/issues/1922 -->
<body>
<script>
"use strict";

for (const withFollowingRule of [false, true]) {
  test(t => {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);
    t.add_cleanup(() => frame.remove());

    const firstURL = new URL("/images/green.png", location);
    const secondURL = new URL("/images/blue.png", location);
    let css = `<!--
body {
  background-color: #333333;
  color: white;
  background-image: url(${firstURL});
}
-->`;
    if (withFollowingRule) {
      css += `body { background-image: url("${secondURL}"); }`;
    }

    const doc = frame.contentDocument;
    doc.open();
    doc.write(`<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>CSS Test</title>
<style type="text/css">
${css}
</style>
</head>
<body>
</body>
</html>`);
    doc.close();

    assert_equals(doc.styleSheets[0].cssRules.length, withFollowingRule ? 2 : 1);
    const style = frame.contentWindow.getComputedStyle(doc.body);
    assert_equals(style.backgroundColor, "rgb(51, 51, 51)");
    assert_equals(style.color, "rgb(255, 255, 255)");
    assert_equals(
      style.backgroundImage,
      `url("${withFollowingRule ? secondURL : firstURL}")`
    );
  }, `HTML comment-wrapped body CSS ${withFollowingRule ? "allows a following rule to override it" : "applies"}`);
}
</script>
