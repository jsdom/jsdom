<!DOCTYPE html>
<meta charset="utf-8">
<title>CSSOM: getComputedStyle() throws on Shadow DOM pseudo-elements</title>
<link rel="help" href="https://drafts.csswg.org/cssom/#dom-window-getcomputedstyle">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<link rel="help" href="https://drafts.csswg.org/cssom/#dom-window-getcomputedstyle">

<div id="test"></div>

<script>
"use strict";

test(() => {
  const div = document.getElementById("test");
  assert_equals(getComputedStyle(div, "::part(foo)").color, "");
}, "Shadow DOM ::part(...) returns the empty string");

test(() => {
  const div = document.getElementById("test");
  assert_equals(getComputedStyle(div, "::slotted(foo)").color, "");
}, "Shadow DOM ::slotted(...) returns the empty string");

</script>
