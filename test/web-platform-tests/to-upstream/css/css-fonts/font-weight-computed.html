<!DOCTYPE html>
<meta charset="utf-8">
<title>Computed values of font-weight</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-weight-prop">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#relative-weights">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div id="target"></div>

<script>
"use strict";

const target = document.getElementById("target");

for (const [specified, computed] of [
  ["normal", "400"],
  ["bold", "700"],
  ["425", "425"],
  ["bolder", "700"],
  ["lighter", "100"]
]) {
  test(() => {
    target.style.fontWeight = specified;
    const style = getComputedStyle(target);
    assert_equals(style.fontWeight, computed, "IDL attribute");
    assert_equals(style.getPropertyValue("font-weight"), computed, "getPropertyValue");
  }, `font-weight: ${specified} computes to ${computed}`);
}

for (const [parentWeight, bolder, lighter] of [
  ["1", "400", "1"],
  ["50", "400", "50"],
  ["100", "400", "100"],
  ["200", "400", "100"],
  ["349", "400", "100"],
  ["350", "700", "100"],
  ["549", "700", "100"],
  ["550", "900", "400"],
  ["749", "900", "400"],
  ["750", "900", "700"],
  ["899", "900", "700"],
  ["900", "900", "700"],
  ["950", "950", "700"],
  ["1000", "1000", "700"]
]) {
  test(() => {
    target.style.fontWeight = parentWeight;
    const child = document.createElement("div");
    target.appendChild(child);

    child.style.fontWeight = "bolder";
    let style = getComputedStyle(child);
    assert_equals(style.fontWeight, bolder, "bolder IDL attribute");
    assert_equals(style.getPropertyValue("font-weight"), bolder, "bolder getPropertyValue");

    child.style.fontWeight = "lighter";
    style = getComputedStyle(child);
    assert_equals(style.fontWeight, lighter, "lighter IDL attribute");
    assert_equals(style.getPropertyValue("font-weight"), lighter, "lighter getPropertyValue");

    child.remove();
  }, `relative weights compute from ${parentWeight}`);
}
</script>
