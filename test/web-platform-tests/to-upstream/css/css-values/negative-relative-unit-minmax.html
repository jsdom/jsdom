<!doctype html>
<meta charset="utf-8">
<title>Negative relative min and max units select the unscaled dimension</title>
<link rel="help" href="https://drafts.csswg.org/css-values-4/#viewport-relative-lengths">
<link rel="help" href="https://drafts.csswg.org/css-conditional-5/#container-lengths">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";

for (const unit of ["vmin", "vmax", "svmin", "svmax", "lvmin", "lvmax", "dvmin", "dvmax", "cqmin", "cqmax"]) {
  test(t => {
    const container = document.createElement("div");
    container.style.cssText = "container-type: size; width: 200px; height: 300px";
    const target = document.createElement("div");
    container.append(target);
    document.body.append(container);
    t.add_cleanup(() => container.remove());
    target.style.marginLeft = `1${unit}`;
    const expected = `-${getComputedStyle(target).marginLeft}`;
    target.style.marginLeft = `-1${unit}`;
    assert_equals(getComputedStyle(target).marginLeft, expected);
  }, `-1${unit} is the negative of 1${unit}`);
}
</script>
