<!DOCTYPE html>
<meta charset="utf-8">
<title>background shorthand</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#background">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/7802">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- Regression test for https://github.com/jsdom/jsdom/issues/3663 -->
<!-- Regression test for https://github.com/jsdom/jsdom/issues/3169 -->

<div id="div" style="background: border-box;"></div>
<img id="img">

<script>
"use strict";

test(() => {
  const div = document.getElementById("div");
  assert_equals(div.style.backgroundOrigin, "border-box");
  assert_equals(div.style.backgroundClip, "border-box");
}, "Set style attribute by default");

test(() => {
  const img = document.getElementById("img");
  img.style.background = 'url("foo.jpg") center/20px no-repeat';
  assert_equals(img.style.backgroundImage, 'url("foo.jpg")');
  assert_equals(img.style.backgroundPosition, "center center");
  assert_equals(img.style.backgroundSize, "20px auto");
  assert_equals(img.style.backgroundRepeat, "no-repeat");
}, "Shorthand value containing '/'");
</script>
