<!doctype html>
<meta charset="utf-8">
<meta name="variant" content="?synchronous">
<meta name="variant" content="?microtask">
<title>Script completion after stopping loading or removing its iframe</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/scripting.html#execute-the-script-element">
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#clean-up-after-running-script">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/html/browsers/browsing-the-web/resources/helpers.js"></script>
<body>
<script>
"use strict";
/* global addIframe */

promise_test(async t => {
  const frame = await addIframe();
  t.add_cleanup(() => frame.remove());
  const child = frame.contentWindow;
  const script = child.document.createElement("script");
  script.src = "data:text/javascript,queueMicrotask(() => window.stop());";
  const loaded = new EventWatcher(t, script, ["load", "error"]).wait_for("load");
  child.document.head.append(script);
  await loaded;
}, "An external script fires load after its microtask stops document loading");

const microtask = location.search === "?microtask";
promise_test(async t => {
  const frame = await addIframe();
  t.add_cleanup(() => frame.remove());
  const child = frame.contentWindow;
  const events = [];
  child.removeFrame = () => {
    frame.remove();
    events.push("removed");
  };
  const script = child.document.createElement("script");
  // Observe dispatch independently of the scripting-disabled checks for onload handlers.
  script.addEventListener("load", () => events.push("load"));
  const loaded = new EventWatcher(t, script, ["load", "error"]).wait_for("load");
  script.src = `data:text/javascript,${microtask ? "queueMicrotask(removeFrame)" : "removeFrame()"};`;
  child.document.head.append(script);
  await loaded;
  assert_array_equals(events, ["removed", "load"]);
}, `An external script fires load after ${microtask ? "its microtask removes" : "removing"} its iframe`);
</script>
