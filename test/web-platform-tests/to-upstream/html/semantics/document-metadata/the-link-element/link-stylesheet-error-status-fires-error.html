<!DOCTYPE html>
<title>link stylesheet with error HTTP status should fire error event and not apply styles</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/semantics.html#the-link-element">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>

<body>
<div id="target404">Test element for 404</div>
<div id="target503">Test element for 503</div>
<script>
"use strict";
/* global get_host_info */

const { HTTP_ORIGIN, HTTP_REMOTE_ORIGIN } = get_host_info();
for (const [description, origin] of [["Same-origin", HTTP_ORIGIN], ["Cross-origin", HTTP_REMOTE_ORIGIN]]) {
  for (const status of [404, 503]) {
    async_test(t => {
      const target = document.getElementById(`target${status}`);
      const initialColor = getComputedStyle(target).color;
      const link = document.createElement("link");
      t.add_cleanup(() => link.remove());
      link.setAttribute("rel", "stylesheet");
      const url = new URL("resources/stylesheet-colors.css", location);
      link.setAttribute("href", `${origin}${url.pathname}?pipe=status(${status})`);

      link.onerror = t.step_func_done(() => {
        assert_equals(getComputedStyle(target).color, initialColor, "Error-response CSS should not be applied");
      });
      link.onload = t.unreached_func("load event should not fire for an error response");
      document.documentElement.appendChild(link);
    }, `${description} link stylesheet should fire error for HTTP ${status} and not apply styles`);
  }
}
</script>
</body>
