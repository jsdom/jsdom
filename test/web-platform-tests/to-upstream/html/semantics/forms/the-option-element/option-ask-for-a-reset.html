<!DOCTYPE HTML>
<title>option element ask-for-a-reset</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/form-elements.html#selectedness-setting-algorithm">
<link rel="author" title="Domenic Denicola" href="mailto:d@domenic.me">
<link rel="author" title="Joris van der Wel" href="mailto:joris@jorisvanderwel.com">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<script>
"use strict";

function createSelect() {
  const select = document.createElement("select");
  select.multiple = false;
  select.size = 1;
  for (let i = 0; i < 3; ++i) {
    select.appendChild(document.createElement("option"));
  }
  return select;
}

function createSelectedOptgroup() {
  const optgroup = document.createElement("optgroup");
  for (let i = 0; i < 3; ++i) {
    const option = document.createElement("option");
    optgroup.appendChild(option);
    option.selected = true;
  }
  return optgroup;
}

function selectedness(options) {
  return Array.from(options, option => option.selected);
}

test(() => {
  const select = createSelect();
  assert_array_equals(selectedness(select.options), [true, false, false]);
}, "Inserting options selects the first option when none are selected");

test(() => {
  const select = createSelect();
  const [optionA, optionB] = select.options;
  optionB.defaultSelected = true;
  optionA.defaultSelected = true;
  assert_array_equals(selectedness(select.options), [true, false, false]);
}, "Setting defaultSelected deselects the other options");

test(() => {
  const select = createSelect();
  const [optionA, optionB] = select.options;
  optionB.defaultSelected = true;
  optionA.defaultSelected = true;
  optionB.defaultSelected = true;
  assert_array_equals(selectedness(select.options), [true, false, false]);
}, "Setting an already-present selected attribute does not change selectedness");

test(() => {
  const select = createSelect();
  const [optionA, optionB] = select.options;
  optionB.defaultSelected = true;
  optionA.defaultSelected = true;
  optionA.disabled = true;
  optionA.defaultSelected = false;
  optionB.defaultSelected = false;
  assert_array_equals(selectedness(select.options), [false, true, false]);
}, "Removing selected attributes selects the first non-disabled option");

test(() => {
  const optgroup = createSelectedOptgroup();
  assert_array_equals(selectedness(optgroup.children), [true, true, true]);
}, "Options in a detached optgroup do not deselect each other");

test(() => {
  const select = createSelect();
  const optgroup = createSelectedOptgroup();
  select.appendChild(optgroup);
  assert_array_equals(selectedness(select.options), [false, false, false, false, false, true]);
}, "Inserting an optgroup with selected options selects only the last option");

test(() => {
  const select = createSelect();
  const optgroup = createSelectedOptgroup();
  select.appendChild(optgroup);
  select.removeChild(optgroup);
  assert_array_equals(selectedness(select.options), [true, false, false]);
}, "Removing the selected optgroup selects the first remaining option");

test(() => {
  const select = createSelect();
  select.options[0].disabled = true;
  assert_array_equals(selectedness(select.options), [true, false, false]);
}, "Disabling the selected option does not change selectedness");

test(() => {
  const select = createSelect();
  select.multiple = true;
  select.options[0].disabled = true;
  for (const option of select.options) {
    option.selected = true;
  }
  select.multiple = false;
  assert_array_equals(selectedness(select.options), [false, false, true]);
}, "Removing multiple selects only the last selected option");

test(() => {
  const select = createSelect();
  select.size = 3;
  select.options[0].disabled = true;
  for (const option of select.options) {
    option.selected = false;
  }
  select.size = 1;
  assert_array_equals(selectedness(select.options), [false, true, false]);
}, "Reducing size to one selects the first non-disabled option when none are selected");
</script>
