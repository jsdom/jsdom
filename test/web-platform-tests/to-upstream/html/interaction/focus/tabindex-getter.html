<!DOCTYPE html>
<meta charset="utf-8">
<!-- Upstreaming note: this supersedes
     https://github.com/web-platform-tests/wpt/blob/f476395b093bdb5401c200f577e35165411804e5/html/interaction/focus/sequential-focus-navigation-and-the-tabindex-attribute/tabindex-getter.html
     Preserve its default-value coverage when upstreaming these additional getter tests. -->
<title>HTML Test: tabIndex getter return value</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#dom-tabindex">
<link rel="help" href="https://html.spec.whatwg.org/multipage/common-microsyntaxes.html#rules-for-parsing-integers">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
#scrollable {
  width: 100px;
  height: 100px;
  overflow: scroll;
}
#scrollable-inner {
  width: 1024px;
  height: 2048px;
}
</style>
<body>
<input>
<input type="hidden">
<button>button</button>
<button disabled>button</button>
<button hidden>button</button>
<a>a</a>
<a href="#">a</a>
<map name="areas"><area></map>
<svg><a>svg a</a></svg>
<link id="nohref">
<textarea></textarea>
<select><optgroup><option>option</option></optgroup></select>
<select multiple></select>
<iframe width="10" height="10"></iframe>
<embed width="10" height="10">
<object width="10" height="10"></object>
<span></span>
<div></div>
<details><div>before summary</div><summary>summary</summary><summary id="secondsummary">second summary</summary></details>
<summary id="standalone-summary">standalone summary</summary>
<div id="hostDelegatesFocus"></div>
<div id="hostNonDelegatesFocus"></div>
<div contenteditable="true"></div>
<div id="scrollable"><div id="scrollable-inner"></div></div>
<fieldset></fieldset>
<output></output>
<slot></slot>
<script>
"use strict";

document.getElementById("hostDelegatesFocus").attachShadow({ mode: "open", delegatesFocus: true });
document.getElementById("hostNonDelegatesFocus").attachShadow({ mode: "open", delegatesFocus: false });

const frame = document.createElement("frame");
document.body.append(frame);

const htmlDefaults = [
  ["input", 0],
  ["input[type='hidden']", 0],
  ["button", 0],
  ["button[disabled]", 0],
  ["button[hidden]", 0],
  ["a", 0],
  ["a[href]", 0],
  ["area", 0],
  ["textarea", 0],
  ["select", 0],
  ["select[multiple]", 0],
  ["option", -1],
  ["optgroup", -1],
  ["frame", 0],
  ["iframe", 0],
  ["embed", -1],
  ["object", 0],
  ["span", -1],
  ["div", -1],
  ["link#nohref", -1],
  ["link[href]", -1],
  ["details", -1],
  ["summary", 0],
  ["summary#secondsummary", -1],
  ["summary#standalone-summary", -1],
  ["#hostDelegatesFocus", -1],
  ["#hostNonDelegatesFocus", -1],
  ["div[contenteditable]", -1],
  ["#scrollable", -1],
  ["fieldset", -1],
  ["output", -1],
  ["slot", -1]
];

for (const [selector, defaultValue] of [...htmlDefaults, ["svg a", 0]]) {
  const element = document.querySelector(selector);

  test(() => {
    assert_equals(element.tabIndex, defaultValue);
  }, `${selector}.tabIndex defaults to ${defaultValue}`);

  for (const value of [-1, 0, 1]) {
    test(t => {
      t.add_cleanup(() => element.removeAttribute("tabindex"));
      element.setAttribute("tabindex", value);
      assert_equals(element.tabIndex, value);
      assert_equals(element.getAttribute("tabindex"), String(value), "getter preserves the attribute");
    }, `${selector}.tabIndex returns ${value} when the attribute is ${value}`);
  }
}

// The generic reflection tests skip cases that return the element-specific default.
const invalidValues = [
  "",
  "   ",
  "foo",
  "\u00A07",
  "\v7",
  "+",
  "-",
  "+ 1",
  "- 1",
  "2147483648",
  "-2147483649",
  "99999999999",
  "-99999999999"
];

for (const [selector, defaultValue] of htmlDefaults) {
  const element = document.querySelector(selector);

  for (const value of invalidValues) {
    test(t => {
      t.add_cleanup(() => element.removeAttribute("tabindex"));
      element.setAttribute("tabindex", "3");
      assert_equals(element.tabIndex, 3, "initial valid value");

      element.setAttribute("tabindex", value);
      assert_equals(element.tabIndex, defaultValue, "invalid value uses the element's default");
      assert_equals(element.getAttribute("tabindex"), value, "getter preserves the invalid attribute");

      element.removeAttribute("tabindex");
      assert_equals(element.tabIndex, defaultValue, "removing the attribute restores the default");
    }, `${selector}.tabIndex falls back to ${defaultValue} for ${JSON.stringify(value)}`);
  }

  test(t => {
    t.add_cleanup(() => element.removeAttribute("tabindex"));
    element.setAttribute("tabindex", "3");
    assert_equals(element.tabIndex, 3);
    element.removeAttribute("tabindex");
    assert_equals(element.tabIndex, defaultValue);
  }, `Removing a valid tabindex restores ${selector}.tabIndex to ${defaultValue}`);
}

// The generic reflection tests only cover HTML elements, and the SVG tests omit the range boundaries.
for (const [value, expected] of [
  ["2147483647", 2147483647],
  ["-2147483648", -2147483648],
  ["2147483648", 0],
  ["-2147483649", 0]
]) {
  test(() => {
    const element = document.createElementNS("http://www.w3.org/2000/svg", "a");
    element.setAttribute("tabindex", value);
    assert_equals(element.tabIndex, expected);
    assert_equals(element.getAttribute("tabindex"), value, "getter preserves the attribute");
  }, `SVG a.tabIndex returns ${expected} for ${JSON.stringify(value)}`);
}

// These numeric-looking strings are not covered by the generic reflection tests.
for (const tagName of ["div", "button"]) {
  for (const [value, expected] of [["1e2", 1], ["0x10", 0]]) {
    test(() => {
      const element = document.createElement(tagName);
      element.setAttribute("tabindex", value);
      assert_equals(element.tabIndex, expected);
      assert_equals(element.getAttribute("tabindex"), value, "getter preserves the attribute");
    }, `${tagName}.tabIndex parses only the leading decimal digits of ${JSON.stringify(value)}`);
  }
}

for (const value of ["foo", "2147483648"]) {
  test(() => {
    const details = document.createElement("details");
    const first = document.createElement("summary");
    const second = document.createElement("summary");
    details.append(document.createElement("div"), first, second);
    first.setAttribute("tabindex", value);
    second.setAttribute("tabindex", value);

    assert_equals(first.tabIndex, 0, "the first summary need not be the first child");
    assert_equals(second.tabIndex, -1, "the second summary is not the summary for its parent");

    first.remove();
    assert_equals(first.tabIndex, -1, "a detached summary has default -1");
    assert_equals(second.tabIndex, 0, "the remaining summary becomes the summary for its parent");
  }, `Summary defaults follow changes to the parent details with tabindex=${JSON.stringify(value)}`);
}
</script>
</body>
