<!doctype html>
<meta charset="utf-8">
<title>performance.now() and performance.timeOrigin are coarsened to at least 100 microseconds</title>
<link rel="help" href="https://w3c.github.io/hr-time/#dfn-coarsen-time">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

function assertCoarsened(value, label) {
  // Allow for floating point error when checking that the value is a multiple of 0.1 ms.
  const tenths = value * 10;
  assert_approx_equals(tenths, Math.round(tenths), 1e-6, `${label} (${value}) is a multiple of 0.1 ms`);
}

test(() => {
  for (let i = 0; i < 1000; ++i) {
    assertCoarsened(performance.now(), "performance.now()");
  }
}, "performance.now() has a resolution of at least 100 microseconds");

test(() => {
  assertCoarsened(performance.timeOrigin, "performance.timeOrigin");
}, "performance.timeOrigin has a resolution of at least 100 microseconds");

test(() => {
  let previous = performance.now();
  for (let i = 0; i < 1000; ++i) {
    const current = performance.now();
    assert_greater_than_equal(current, previous, "performance.now() is monotonic");
    previous = current;
  }
}, "performance.now() stays monotonic after coarsening");
</script>
